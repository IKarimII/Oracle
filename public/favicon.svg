<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- The orb from the app, frozen: a grey pearl with a dark rim and a highlight top-left. -->
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#9a9a9f"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#0b0b0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b0c" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.32" cy="0.26" r="0.24">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#swirl)"/>
  <circle cx="32" cy="32" r="29" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="29" fill="url(#shine)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
</svg>
